services:
  - type: web
    name: vectra-3d-ip-intelligence
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 30
    healthCheckPath: /health
    envVars:
      - key: IPINFO_TOKEN
        sync: false
      - key: IPINFO_TIMEOUT
        value: "8"
      - key: DATABASE_PATH
        value: "ip_tracker.db"
